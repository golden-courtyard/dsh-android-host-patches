name: scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 语法检查
        run: |
          fail=0
          for f in *.sh examples/dsh-wrapper; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: 静态检查
        # -s bash：脚本的 shebang 是 Termux 路径（/data/data/com.termux/...），
        #          不指定方言时 shellcheck 无法从 shebang 判出语言。
        # -S warning：只报 warning 及以上，先不追 style 类噪音。
        run: |
          shellcheck --version
          shellcheck -s bash -S warning *.sh examples/dsh-wrapper
